<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Fixture 02 – Login Page</title>
<style>body{font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f3f4f6}.card{background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1);width:360px}h1{margin:0 0 24px;font-size:22px}label{display:block;margin-top:14px;font-size:13px;color:#555;font-weight:600}input{width:100%;padding:9px;margin-top:4px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box;font-size:14px}.btn{width:100%;margin-top:24px;padding:11px;background:#1d4ed8;color:#fff;border:none;border-radius:7px;cursor:pointer;font-size:15px;font-weight:600}a{display:block;text-align:center;margin-top:12px;color:#2563eb;font-size:13px}</style>
</head>
<body>
<div class="card">
  <h1>Sign In</h1>
  <form>
    <label>Email or Username<input type="email" autocomplete="email" placeholder="you@example.com"></label>
    <label>Password<input type="password" autocomplete="current-password" placeholder="••••••••"></label>
    <button type="button" class="btn">Continue</button>
  </form>
  <a href="#">Forgot password?</a>
  <a href="#">Create an account</a>
</div>
</body></html>
