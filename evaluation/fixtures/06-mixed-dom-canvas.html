<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Fixture 06 – Mixed DOM + Canvas (Balanced Mode Target)</title>
<style>body{font-family:sans-serif;max-width:560px;margin:30px auto;padding:0 20px}h1{font-size:18px}label{display:block;margin-top:14px;font-size:13px;font-weight:600;color:#374151}input{width:100%;padding:8px;border:1px solid #d1d5db;border-radius:5px;box-sizing:border-box;margin-top:4px}.section{border:1px solid #e5e7eb;border-radius:8px;padding:20px;margin-top:20px}.section h2{font-size:15px;margin:0 0 12px;color:#1f2937}canvas{display:block;border:1px solid #e5e7eb;border-radius:6px;background:#fff}.btn{margin-top:20px;padding:10px 22px;background:#2563eb;color:#fff;border:none;border-radius:7px;cursor:pointer;font-size:14px;font-weight:600}</style>
</head>
<body>
<h1>Insurance Claim Form</h1>

<!-- Section 1: Standard DOM inputs — DOM scanner handles this fine -->
<div class="section">
  <h2>Personal Details</h2>
  <label>Policy Holder Name<input type="text" autocomplete="name" placeholder="Full name"></label>
  <label>Email<input type="email" autocomplete="email" placeholder="you@example.com"></label>
  <label>Phone<input type="tel" autocomplete="tel" placeholder="+91 XXXXX XXXXX"></label>
</div>

<!-- Section 2: Signature pad rendered on canvas — DOM scanner misses what's inside -->
<div class="section">
  <h2>Signature (drawn on canvas)</h2>
  <canvas id="sigPad" width="520" height="120"></canvas>
  <p style="font-size:12px;color:#6b7280;margin-top:6px">Draw your signature above using mouse or touch.</p>
</div>

<!-- Section 3: Captcha-style image with embedded text — OCR/ViT challenge -->
<div class="section">
  <h2>Verification</h2>
  <canvas id="captcha" width="200" height="60"></canvas>
  <label style="margin-top:10px">Enter the code shown above
    <input type="text" placeholder="Type the code">
  </label>
</div>

<button type="button" class="btn">Continue</button>

<script>
// Render signature pad lines
const sig = document.getElementById('sigPad');
const sCtx = sig.getContext('2d');
sCtx.fillStyle = '#f9fafb';
sCtx.fillRect(0, 0, 520, 120);
sCtx.strokeStyle = '#cbd5e1';
sCtx.setLineDash([4, 4]);
sCtx.moveTo(20, 100); sCtx.lineTo(500, 100); sCtx.stroke();
sCtx.setLineDash([]);
sCtx.fillStyle = '#9ca3af';
sCtx.font = '12px sans-serif';
sCtx.fillText('Sign here', 20, 90);

// Draw a fake captcha canvas — text inside image
const cap = document.getElementById('captcha');
const cCtx = cap.getContext('2d');
cCtx.fillStyle = '#f3f4f6';
cCtx.fillRect(0, 0, 200, 60);
// Wavy background lines
for (let i = 0; i < 5; i++) {
  cCtx.strokeStyle = `hsl(${i * 40}, 60%, 70%)`;
  cCtx.beginPath();
  cCtx.moveTo(0, 20 + i * 8);
  cCtx.bezierCurveTo(60, 10 + i * 8, 140, 40 + i * 8, 200, 20 + i * 8);
  cCtx.stroke();
}
// The actual captcha text — only OCR or ViT can read this
cCtx.fillStyle = '#1f2937';
cCtx.font = 'bold 28px monospace';
cCtx.fillText('X7R2P', 30, 42);
</script>
</body></html>
