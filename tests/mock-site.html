<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identity Verification Portal</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05), 0 10px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
    }
    h1 {
      margin-top: 0;
      color: #111827;
      font-size: 24px;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #374151;
      font-weight: 500;
      font-size: 14px;
    }
    input[type="text"], input[type="email"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }
    button.btn {
      width: 100%;
      padding: 12px;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }
    button.btn:hover {
      background-color: #4338ca;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Identity Verification</h1>
    <p class="subtitle">Please enter your details to verify your account.</p>

    <form id="verify-form" onsubmit="event.preventDefault(); alert('Form submitted!');">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Rahul Sharma" autocomplete="name">
      </div>
      
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="rahul.sharma@example.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="aadhaar">Aadhaar Number</label>
        <!-- The value is intentionally left blank so the shadow agent can target it -->
        <input type="text" id="aadhaar" name="aadhaar" placeholder="XXXX XXXX XXXX">
      </div>

      <div class="form-group">
        <label for="pan">PAN Number</label>
        <input type="text" id="pan" name="pan" placeholder="ABCDE1234F">
      </div>

      <button type="submit" class="btn" id="submitBtn">Verify Identity</button>
    </form>
  </div>

</body>
</html>
